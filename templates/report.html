<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit Status Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .table-container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ccc;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .status-approved {
            color: green;
            font-weight: bold;
        }

        .status-disapproved {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Permit Status Report</h1>
    <div class="table-container">
        <table id="permitTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Origin District</th>
                    <th>Origin District Status</th>
                    <th>Destination District</th>
                    <th>Destination District Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be populated dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/permit-status')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector("#permitTable tbody");
                    data.forEach(permit => {
                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${permit.id}</td>
                            <td>${permit.name}</td>
                            <td>${permit.origin_district}</td>
                            <td class="${permit.origin_status === 'Approved' ? 'status-approved' : 'status-disapproved'}">
                                ${permit.origin_status}
                            </td>
                            <td>${permit.destination_district}</td>
                            <td class="${permit.destination_status === 'Approved' ? 'status-approved' : 'status-disapproved'}">
                                ${permit.destination_status}
                            </td>
                        `;

                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error("Error fetching permit status:", error);
                });
        });
    </script>

</body>
</html>
