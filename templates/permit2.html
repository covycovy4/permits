<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit Submissions</title>
    <style>
        /* General Styles */
        body { font-family: Arial, sans-serif; margin: 20px; padding: 0; background-color: #f9f9f9; }
        .container { width: 90%; max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); }
        h1 { text-align: center; }
        a { text-decoration: none; margin-right: 10px; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; cursor: pointer; }
        button { cursor: pointer; padding: 5px 10px; border: none; background: #007BFF; color: white; border-radius: 3px; }
        button:hover { background: #0056b3; }

        /* Popup & Overlay */
        .overlay, .popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .overlay { width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 999; }
        .popup { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); z-index: 1000; }
        .popup h3 { margin-top: 0; }
        .close-popup { display: block; margin-top: 20px; text-align: center; cursor: pointer; color: #007BFF; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Search and Filter Movement Permits</h1>
        <form id="filterForm">
            <label for="district">District:</label>
            <select id="district" name="district">
                <option value="">All</option>
                <option value="Mutare">Mutare</option>
                <option value="Mutasa">Mutasa</option>
                <option value="Nyanga">Nyanga</option>
                <option value="Makoni">Makoni</option>
                <option value="Chimanimani">Chimanimani</option>
                <option value="Buhera">Buhera</option>
                <option value="Chipinge">Chipinge</option>
            </select>
            <button type="submit">Search</button>
        </form>
    </div>

    <h1>Permit Submissions</h1>
    <table id="permitTable">
        <thead>
            <tr>
                <th onclick="sortTable(0)">Date</th>
                <th onclick="sortTable(1)">ID</th>
                <th onclick="sortTable(2)">Name</th>
                <th onclick="sortTable(3)">Origin District</th>
                <th onclick="sortTable(4)">Destination District</th>
                <th onclick="sortTable(5)">Number of Animals</th>
                <th onclick="sortTable(6)">Payment Amount</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="popup" id="popup">
        <div id="popupContent"></div>
        <span class="close-popup" onclick="closePopup()">Close</span>
    </div>

    <script>
        async function fetchSubmissions() {
            try {
                const response = await fetch('/api/submissions');
                const permits = await response.json();
                const tableBody = document.querySelector('#permitTable tbody');
                tableBody.innerHTML = '';
                
                permits.forEach(permit => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${permit.date}</td>
                        <td><a href="#" onclick="showDetails(${permit.id})">${permit.name}</a></td>
                        <td>${permit.origin_district}</td>
                        <td>${permit.destination_district}</td>
                        <td>${permit.number_of_animals}</td>
                        <td>${permit.payment_amount}</td>
                        <td>
                            <button onclick="editPermit(${permit.id})">Edit</button>
                            <button onclick="deletePermit(${permit.id})">Delete</button>
                        </td>`;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching submissions:', error);
            }
        }

        async function showDetails(id) {
            try {
                const response = await fetch(`/api/submissions/${id}`);
                const permit = await response.json();
                if (!response.ok) throw new Error(permit.error);
                
                document.getElementById('popupContent').innerHTML = `
                    <h3>Permit Summary</h3>
                    <p><strong>Name:</strong> ${permit.name}</p>
                    <p><strong>Number of Animals:</strong> ${permit.number_of_animals}</p>
                    <p><strong>Origin:</strong> ${permit.origin_district}</p>
                    <p><strong>Destination:</strong> ${permit.destination_district}</p>
                    <p><strong>Amount Paid:</strong> ${permit.payment_amount} USD</p>`;
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('popup').style.display = 'block';
            } catch (error) {
                alert('Error fetching permit details');
            }
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('popup').style.display = 'none';
        }

        async function deletePermit(id) {
            if (confirm('Are you sure?')) {
                try {
                    const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
                    if (response.ok) document.querySelector(`#permitTable tr[data-id='${id}']`).remove();
                } catch (error) {
                    alert('Error deleting permit');
                }
            }
        }

        document.getElementById('filterForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const district = document.getElementById('district').value;
            fetchSubmissions(`/api/submissions?district=${district}`);
        });

        fetchSubmissions();
    </script>
</body>
</html>
